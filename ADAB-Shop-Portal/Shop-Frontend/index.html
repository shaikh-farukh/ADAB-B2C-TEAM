<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADAB Seller Portal (React)</title>
  
  <!-- Essential External Assets -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = { 
        theme: { 
          extend: { 
            fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }, 
            colors: { brand: { green: '#22C55E', dark: '#15803D', light: '#DCFCE7', orange: '#F97316' } } 
          } 
        } 
      };
    }
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; margin: 0; background: #F9FAFB; color: #1F2937; }
    .card { background: white; border-radius: 16px; border: 1px solid #E5E7EB; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .btn-primary { background: #15803D; color: white; font-weight: 700; border-radius: 12px; padding: 10px 18px; border: none; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { background: #166534; }
    .btn-soft { background: #F3F4F6; color: #374151; font-weight: 600; border-radius: 12px; padding: 10px 18px; border: none; cursor: pointer; transition: all 0.2s; }
    .btn-soft:hover { background: #E5E7EB; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
  
  <!-- React Mount Point -->
  <div id="root"></div>
  
  <!-- Vite Entry -->
  <script type="module" src="/src/main.jsx"></script>
  
</body>
</html>
