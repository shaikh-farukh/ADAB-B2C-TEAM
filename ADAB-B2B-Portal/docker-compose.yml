services:
  b2b-db:
    image: postgres:15-alpine
    container_name: adab_b2b_db
    restart: always
    environment:
      POSTGRES_USER: adab_user
      POSTGRES_PASSWORD: adab_password
      POSTGRES_DB: adab_b2b_db
    ports:
      - "5435:5432"
    volumes:
      - b2b_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U adab_user -d adab_b2b_db" ]
      interval: 3s
      timeout: 3s
      retries: 10

  b2b-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adab_b2b_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: b2b-db
      DB_USER: adab_user
      DB_PASSWORD: adab_password
      DB_NAME: adab_b2b_db
      DB_PORT: 5432
      DB_SSL_MODE: disable
      JWT_SECRET: b2b_portal_jwt_secret_key_2026_adab
      MINIO_ENDPOINT: minio
      MINIO_PUBLIC_HOST: localhost
      MINIO_PORT: 9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKET: adab-uploads
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-b2b_portal_jwt_secret_key_2026_adab}
    env_file:
      - ./backend/.env
    depends_on:
      b2b-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  b2b-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adab_b2b_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    env_file:
      - ./frontend/.env
    depends_on:
      - b2b-backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  minio:
    image: quay.io/minio/minio:latest
    container_name: adab_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  b2b_postgres_data:
  minio_data:

